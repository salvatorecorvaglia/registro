name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Select an existing v-prefixed release tag to publish."
          exit 1
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Validate tag version against pyproject.toml
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            PY_VERSION=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
            echo "Tag version: $TAG_VERSION | pyproject.toml version: $PY_VERSION"
            if [[ "$TAG_VERSION" != "$PY_VERSION" ]]; then
              echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PY_VERSION)"
              exit 1
            fi
          fi

  checks:
    name: Release checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Download validated distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-packages
          path: dist
      - name: Verify distribution checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Extract Changelog Entry
        id: extract_changelog
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c '
          import os, re, uuid
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("CHANGELOG.md") as f:
              content = f.read()
          pattern = rf"(?m)^##\s+\[?{re.escape(version)}\]?(.*?)(?=^##\s+\[?|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = ""
          if match:
              raw_notes = match.group(1).strip()
              lines = raw_notes.splitlines()
              if lines and (re.search(r"\d{4}-\d{1,2}-\d{1,2}", lines[0]) or not lines[0].strip()):
                  notes = "\n".join(lines[1:]).strip()
              else:
                  notes = raw_notes
          if not notes:
              notes = "No changelog entry found for this release."
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              delimiter = f"EOF_{uuid.uuid4().hex}"
              with open(github_output, "a") as f:
                  f.write(f"body<<{delimiter}\n{notes}\n{delimiter}\n")
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Registro ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.body }}
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          generate_release_notes: false

      - name: Remove checksum manifest before publishing
        run: rm dist/SHA256SUMS

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  homebrew-wheelhouse:
    name: Build Homebrew Python bundles
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin_arm64
          - os: macos-15-intel
            target: darwin_amd64
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Build and test locked offline wheelhouse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/build_homebrew_bundle.py --tag "$RELEASE_TAG" --target "$TARGET" --output bundles
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-${{ matrix.target }}
          path: bundles/*.tar.gz
          if-no-files-found: error

  homebrew:
    name: Publish Homebrew manifest
    needs: [release, homebrew-wheelhouse]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          python3 scripts/homebrew.py --version "$RELEASE_TAG" --list-assets
      - name: Test manifest generation
        run: python3 -m unittest discover -s tests/homebrew -v
      - uses: actions/download-artifact@v8
        with:
          pattern: homebrew-*
          path: homebrew-assets
          merge-multiple: true
      - name: Download verified stable assets and generate manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare_homebrew.py --tag "$RELEASE_TAG" --directory homebrew-assets
          python3 scripts/homebrew.py --version "$RELEASE_TAG" --assets homebrew-assets --output homebrew-release
          ruby -c homebrew-release/registro.rb
      - name: Attach manifest and checksums to the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" homebrew-release/* homebrew-assets/*.tar.gz --clobber
      - name: Update personal tap when a token is configured
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            python3 scripts/publish_homebrew.py --formula homebrew-release/registro.rb
          else
            echo 'The personal tap pulls checksum-verified stable manifests on its schedule.' >> "$GITHUB_STEP_SUMMARY"
          fi

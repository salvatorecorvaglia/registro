[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "registro"
version = "1.0.0"
description = "A terminal-first database workspace for modern engineers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    {name = "Salvatore Corvaglia"},
]

dependencies = [
    "pydantic==2.13.5",
    "structlog>=24.4",
    "aiosqlite>=0.20",
    "textual>=0.83",
    "rich>=13.7",
    "rapidfuzz==3.14.6",
    "typer==0.27.2",
    "packaging>=24.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.1"]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
mysql = ["asyncmy2>=0.2.20", "cryptography>=50.0.0"]
all = [
    "duckdb>=1.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "asyncmy2>=0.2.20",
    "cryptography>=50.0.0",
]

[project.scripts]
registro = "registro_cli.main:main"

[project.urls]
Homepage = "https://github.com/salvatorecorvaglia/registro"
Documentation = "https://github.com/salvatorecorvaglia/registro#readme"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.16.7",
    "mypy>=1.13",
    "testcontainers>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/registro_core",
    "src/registro_adapters",
    "src/registro_engine",
    "src/registro_plugins",
    "src/registro_cli",
    "src/registro_tui",
]

[tool.hatch.build.targets.wheel.shared-data]
"src/registro_tui/registro.tcss" = "share/registro/registro.tcss"

[tool.hatch.build.targets.wheel.force-include]
"src/registro_tui/registro.tcss" = "registro_tui/registro.tcss"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live database (postgres/mysql)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore::DeprecationWarning:aiosqlite.*",
    # aiosqlite's Connection.__del__ logs a ResourceWarning when finalized
    # without explicit close — Textual's pilot teardown can race this on app
    # exit. Suppress the warning so test_app_smoke is deterministic.
    "ignore::ResourceWarning:aiosqlite.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/tests/**", "**/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# The gate has to be met by the *offline* run (macOS CI, and the default local
# run), which cannot exercise the Postgres/MySQL adapters at all. The run with
# integration enabled clears it comfortably. Raise this in step with the
# offline suite, not with the integration one.
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

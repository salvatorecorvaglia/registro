[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "registro-db"
version = "1.3.1"
description = "A terminal-first database workspace for modern engineers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    {name = "Salvatore Corvaglia"},
]

# Lower bounds, not exact pins: this is a library installed next to other
# packages, and ``==`` pins force resolver conflicts on every consumer.
# Reproducible builds come from ``uv.lock`` (CI and the Docker image both use
# ``--frozen``).
dependencies = [
    "pydantic>=2.14.3",
    "structlog>=24.4",
    "aiosqlite>=0.20",
    "textual>=0.83",
    "rich>=13.7",
    "rapidfuzz>=3.14.6",
    "typer>=0.29.2",
    "packaging>=24.0",
    "duckdb==2.0.0",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=2.0.0",
]
# aiosqlite is already a core dependency (the query history uses it); the
# extra stays so ``registro-db[sqlite]`` keeps working.
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
# ``cryptography`` is only needed for MySQL 8's caching_sha2_password auth.
# Cap it below 49: 49.0.0 dropped the universal2 macOS wheels, so Intel Macs
# have no binary wheel to install.
mysql = ["asyncmy2>=0.2.20", "cryptography>=50.0.2,<51"]
all = [
    "duckdb>=2.0.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "asyncmy2>=0.2.20",
    "cryptography>=50.0.2,<51",
]

[project.scripts]
registro = "registro_cli.main:main"

[project.urls]
Homepage = "https://github.com/salvatorecorvaglia/registro"
Documentation = "https://github.com/salvatorecorvaglia/registro#readme"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=5.0",
    "ruff==0.17.5",
    "mypy>=2.4.1",
    "testcontainers>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/registro_core",
    "src/registro_adapters",
    "src/registro_engine",
    "src/registro_plugins",
    "src/registro_cli",
    "src/registro_tui",
]

[tool.hatch.build.targets.wheel.force-include]
"src/registro_tui/registro.tcss" = "registro_tui/registro.tcss"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live database (postgres/mysql)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore::DeprecationWarning:aiosqlite.*",
    # aiosqlite's Connection.__del__ logs a ResourceWarning when finalized
    # without explicit close — Textual's pilot teardown can race this on app
    # exit. Suppress the warning so test_app_smoke is deterministic.
    "ignore::ResourceWarning:aiosqlite.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["**/tests/**", "**/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# The gate has to be met by the *offline* run (macOS CI, and the default local
# run), which cannot exercise the Postgres/MySQL adapters at all. The run with
# integration enabled clears it comfortably. Raise this in step with the
# offline suite, not with the integration one.
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
